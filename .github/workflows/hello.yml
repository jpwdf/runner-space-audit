name: Hello World

on:
  workflow_dispatch:

jobs:
  disk_check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run dpkg -l
        run: dpkg -l
      
      - name: Find files
        run: find / 2>/dev/null || true
      
      - name: Disk usage
        run: df -h
      
      - name: Check /opt
        run: du -sh /opt/* || true
      
      - name: Check /usr
        run: du -sh /usr/* || true
      
      - name: Check /var
        run: du -sh /var/* || true
      
      - name: Check /usr/local
        run: du -sh /usr/local/* || true
