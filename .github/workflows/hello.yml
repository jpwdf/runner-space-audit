name: Hello World

on:
  workflow_dispatch:

jobs:
  disk_check:
    # runs-on: ubuntu-latest
    runs-on: ubuntu-26.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Disk usage
        run: df -h

      - name: Remove unnecessary packages
        run: |
          sudo apt-get autoremove --purge -y \
            azure-cli azure-vm-utils walinuxagent \
            apache2 apache2-bin apache2-data apache2-utils \
            adwaita-icon-theme \
            at-spi2-common \
            aardvark-dns \
            apport apport-symptoms apport-core-dump-handler \
            appstream xml-core \
            whiptail \
            aria2 xxd zsync \
            xfsprogs zerofree bcache-tools \
            xul-ext-ubufox \
            ant ant-optional bison
          sudo rm -rf /opt/*
      
      - name: Run dpkg -l
        run: dpkg -l
      
      - name: Find files
        run: find / 2>/dev/null || true
      
      - name: Check /opt
        run: sudo du -sh /opt/* || true
      
      - name: Check /usr
        run: sudo du -sh /usr/* || true
      
      - name: Check /var
        run: sudo du -sh /var/* || true

      - name: Check /var/lib
        run: sudo du -sh /var/lib || true
      
      - name: Check /usr/local
        run: sudo du -sh /usr/local/* || true

      - name: Disk usage after cleanup
        run: df -h
